# Minimal function config. Secrets live in the dashboard, not here.
# Toets project should set PAYFAST_MODE=sandbox (the code default).

[functions.payfast-checkout]
verify_jwt = true
entrypoint = "./functions/payfast-checkout/index.js"

# PayFast posts ITN with no JWT. Signature + origin + /eng/query/validate are the auth.
[functions.payfast-itn]
verify_jwt = false
entrypoint = "./functions/payfast-itn/index.js"
